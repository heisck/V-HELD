services:
  # Local LibSQL / Turso-compatible database container
  # Securely bound strictly to 127.0.0.1 (never exposed externally)
  vheld-db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: vheld-dev-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SQLD_AUTH_JWT_KEY=dev_token_libsql_local
      - SQLD_NODE=standalone
    volumes:
      - vheld_db_data:/var/lib/sqld

  # Local Redis container (Upstash Redis equivalent for development caching/rate limiting)
  # Securely bound strictly to 127.0.0.1 (never exposed externally)
  vheld-redis:
    image: docker.io/library/redis:7-alpine
    container_name: vheld-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - vheld_redis_data:/data

volumes:
  vheld_db_data:
  vheld_redis_data:
